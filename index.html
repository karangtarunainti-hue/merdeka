<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Taruna Inti</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1D4B36">
<meta name="background-color" content="#FBF6EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taruna Inti">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.min.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Tutup menu">✕</button>
    <div class="brand">
      <div class="brand-text">
        <div class="eyebrow">Management</div>
        <h1>KEGIATAN INTI</h1>
      </div>
      <button class="sidebar-collapse-toggle" id="sidebar-collapse-toggle" type="button" title="Perkecil menu" aria-label="Perkecil menu">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    
    <!-- USER INFO -->
    <div class="user-info" id="user-info">
      <div class="name" id="user-name-display">
        <span id="user-icon">👤</span>
        <span id="user-name-text">Anggota</span>
      </div>
      <button class="btn-login" id="btn-login" onclick="openLoginModal()">Login</button>
      <button class="btn-logout" id="btn-logout" onclick="logout()" style="display:none;">Logout</button>
    </div>
    
    <nav class="nav nav-global" id="nav-global"></nav>
    <div class="event-block">
      <label>Kegiatan Aktif</label>
      <!-- Dropdown custom (bukan <select> native) supaya bisa nampilin nama
           event + saldo dalam layout dua kolom yang rapi, dan panel pilihannya
           bisa di-styling penuh (native <select> punya dropdown pihak OS/browser
           yang nggak bisa diubah tampilannya). <select id="event-select"> di
           bawah TETAP ADA (disembunyikan) sebagai "sumber kebenaran" satu-
           satunya buat activeEventId — listener change-nya di js/19-init.js
           yang beneran manggil setActiveEvent(), termasuk cek izin (canEdit()).
           Trigger & panel ini cuma lapisan visual, disinkron dari situ lewat
           renderEventDropdown() (js/05-navigation.js). -->
      <div class="event-dropdown" id="event-dropdown">
        <button type="button" class="event-dropdown-trigger" id="event-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="event-dropdown-trigger-info">
            <span class="event-dropdown-trigger-name" id="event-dropdown-trigger-name">— Belum ada event —</span>
            <span class="event-dropdown-trigger-saldo" id="event-dropdown-trigger-saldo"></span>
          </span>
          <svg class="event-dropdown-chevron" viewBox="0 0 24 24" width="16" height="16"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="event-dropdown-panel" id="event-dropdown-panel" role="listbox"></div>
      </div>
      <select class="event-select" id="event-select" tabindex="-1" aria-hidden="true"></select>
      <button class="btn-ghost-light" id="btn-new-event" type="button" style="display:none;">+ Event Baru</button>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="left">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Menu">☰</button>
        <div>
          <h2 id="page-title">Buku Kegiatan</h2>
          <div class="sub" id="page-sub"></div>
        </div>
      </div>
      <div class="saldo-chip" id="saldo-chip" title="Proyeksi anggaran: sudah termasuk kebutuhan &amp; hadiah yang direncanakan, belum tentu sudah dibelanjakan.">
        <span class="lbl">Proyeksi Saldo</span>
        <span class="val mono" id="saldo-val">Rp 0</span>
      </div>
      <button class="btn small lpj-share-btn" id="lpj-share-btn" type="button" style="display:none;" onclick="kirimLpjKeGrupWa()">
        <svg class="inline-icon" viewBox="0 0 24 24"><path d="M20.52 3.48A11.86 11.86 0 0 0 12.04 0C5.5 0 .18 5.32.18 11.86c0 2.09.55 4.13 1.6 5.93L0 24l6.4-1.68a11.8 11.8 0 0 0 5.64 1.44h.01c6.54 0 11.86-5.32 11.86-11.86 0-3.17-1.23-6.15-3.39-8.42Zm-8.48 18.24h-.01a9.86 9.86 0 0 1-5.02-1.37l-.36-.21-3.8 1 1.01-3.7-.24-.38a9.85 9.85 0 0 1-1.51-5.2c0-5.45 4.44-9.89 9.9-9.89 2.64 0 5.13 1.03 6.99 2.9a9.82 9.82 0 0 1 2.9 6.99c0 5.45-4.44 9.86-9.86 9.86Zm5.41-7.39c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.24-.46-2.37-1.46-.87-.78-1.47-1.74-1.64-2.04-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37s-1.04 1.02-1.04 2.48 1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35Z" fill="currentColor"/></svg>
        <span class="lpj-share-btn-label">Kirim Grup WA</span>
      </button>
    </div>
    <div id="content"></div>
    <footer class="app-footer">
      <div class="app-footer-quote">&ldquo;Senyum adalah buah dari pemahaman&rdquo;</div>
    </footer>
  </main>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">Judul</h3>
      <button class="close-x" id="modal-close" type="button">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- OFFLINE GUARD: layar buram + peringatan saat device tidak ada koneksi internet,
     supaya user tidak bisa input data (mencegah konflik data antar perangkat saat
     koneksi kembali & proses sinkronisasi berjalan). -->
<div class="offline-overlay" id="offline-overlay" aria-hidden="true">
  <div class="offline-box">
    <div class="offline-icon">📡</div>
    <h3>Tidak Ada Akses Internet</h3>
    <p>Koneksi internet perangkat ini terputus. Input dinonaktifkan sementara agar data tidak bentrok dengan perangkat lain.</p>
    <div class="offline-status" id="offline-status">
      <span class="offline-dot"></span> Menunggu koneksi kembali&hellip;
    </div>
  </div>
</div>

<script src="vendor/supabase.js" defer></script>
<script src="icons/lucide-icons.local.min.js" defer></script>

<!-- App awalnya 1 file besar (script.js), lalu dipecah jadi beberapa file per
     modul (lihat folder js/), lalu digabung+diminify jadi satu file
     js/app.bundle.min.js untuk production (lihat js/README-BUNDLE.md untuk
     cara build ulang setelah edit modul). script.js sendiri sudah dihapus
     dari repo karena sudah tidak dipakai sama sekali.
     PENTING: urutan modul di dalam bundle HARUS sama seperti urutan asli di
     bawah, karena modul-modul ini saling bergantung lewat variabel/fungsi
     global bersama (bukan ES module dengan import/export):
     00-config, 01-utils-currency, 02-auth, 03-db-core, 04-event-settings,
     05-navigation, 06-login-users, 07-dashboard, 08-anggota,
     09-donatur-transaksi-operasional, 10-lomba, 10b-database-lomba, 11-belanja,
     12-jadwal-agenda-kas, 13-lpj, 14-dokumen, 15-pengaturan-event,
     15b-snapshot, 16-ui-helpers, 16b-event-delegation, 17a-gudang-core, 17b-gudang-pinjam,
     17c-gudang-histori-kelola, 18-getters-refresh, 26-ai, 27-ai-insight, 24-bookmark,
     22-dana-sosial, 20-panduan, 21-icons-lucide, 23-install-prompt, 19-init.
     html2canvas (dulu di-load eager di sini) sekarang di-lazy-load lewat
     ensureHtml2Canvas() di js/16-ui-helpers.js, hanya saat fitur "Download
     Gambar/JPEG" benar-benar dipakai. -->
<script src="js/app.bundle.min.js" defer></script>
<!-- Pendaftaran service worker dipindah dari inline <script> ke file terpisah
     supaya Content-Security-Policy (lihat _headers) tidak perlu membuka
     'unsafe-inline' untuk script. -->
<script src="js/sw-register.js" defer></script>
</body>
</html>
